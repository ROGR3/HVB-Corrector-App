[package]
name = "hvb-corrector-app"
version = "0.1.0"
description = "HVB corrector: apparent vs. corrected vaccine/intervention effectiveness from a simple CSV"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hvb_corrector_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
